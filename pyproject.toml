[project]
name = "mlbundle"
version = "0.3.0"
description = "Pickle-free, verifiable model bundles with a manifest, schema and structure."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pablo Ulloa Santín", email = "ulloasantinpablo2@gmail.com" }]
keywords = [
    "machine-learning",
    "mlops",
    "model-serialization",
    "model-packaging",
    "reproducibility",
    "security",
    "scikit-learn",
    "xgboost",
    "catboost",
    "onnx",
    "skops",
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.14"
dependencies = ["pydantic>=2.13.4,<3"]

[project.scripts]
mlbundle = "mlbundle.cli:main"

[project.optional-dependencies]
# sklearn's floor provides get_tags; other floors match the runtime baseline.
sklearn = ["scikit-learn>=1.6", "skops>=0.16.0"]
xgboost = ["xgboost>=3.4.1", "scikit-learn>=1.2"]
# Audited CBM schema and Python 3.14 wheels on Windows/Linux.
catboost = ["catboost>=1.2.10"]
onnx = ["onnx>=1.23.0", "onnxruntime>=1.30.0"]
# The reader validates the 0.3 vocabulary; schema inference requires Python 3.14.
schema = ["mlschema>=0.3.0,<0.4; python_version == '3.14'"]
# Export resolves pylock.toml with uv's per-platform pylock output.
lock = ["uv>=0.13.5"]
all = [
    "scikit-learn>=1.6", "skops>=0.16.0", "xgboost>=3.4.1", "catboost>=1.2.10",
    "onnx>=1.23.0", "onnxruntime>=1.30.0",
    "mlschema>=0.3.0,<0.4; python_version == '3.14'", "uv>=0.13.5",
]

[project.urls]
Homepage = "https://github.com/UlloaSP/mlbundle"
Repository = "https://github.com/UlloaSP/mlbundle"
Issues = "https://github.com/UlloaSP/mlbundle/issues"
Documentation = "https://github.com/UlloaSP/mlbundle/blob/main/README.md"

[dependency-groups]
dev = [
    "ruff>=0.15.15",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.0",
    # Install every adapter and schema inference in the development environment.
    "mlbundle[all]",
    "pandas>=3.0.6",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = ["network: resolves real locks through the package index"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
    "--cov=mlbundle",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["mlbundle"]
branch = true
parallel = true
# CI measures the installed wheel inside site-packages.
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 88
# Keep source syntax portable while package metadata requires Python 3.14.
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [".git", ".venv", "__pycache__", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "C90",  # mccabe complexity
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "TID",  # flake8-tidy-imports
    "SIM",  # flake8-simplify
    "DTZ",  # flake8-datetimez
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate
    "PL",   # pylint
    "PERF", # perflint
    "RUF",  # ruff-specific rules
]
ignore = ["E501", "PLR0913", "PLR2004", "RET504"]

[tool.ruff.lint.per-file-ignores]
"src/mlbundle/model_io.py" = ["PLC0415"]  # Lazy optional adapter imports.
"src/mlbundle/registry.py" = ["PLC0415"]
"tests/**/*.py" = ["ARG", "PLR2004", "PLR0124", "PLC0415", "S101", "DTZ"]
# The base/artifact checks must run without importing the sklearn fixture producer.
"scripts/package_smoke.py" = ["PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["mlbundle"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pyright]
include = ["src"]
exclude = ["tests", "**/node_modules", "**/__pycache__", ".venv", ".git"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportGeneralTypeIssues = true
reportOptionalMemberAccess = true
reportOptionalCall = true
reportOptionalIterable = true
reportOptionalContextManager = true
reportOptionalOperand = true
reportUntypedFunctionDecorator = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportMissingParameterType = false
reportCallInDefaultInitializer = false
reportUnusedImport = true
reportUnusedClass = false
reportUnusedFunction = false
reportUnusedVariable = true
reportDuplicateImport = true
reportUnnecessaryIsInstance = false
reportUnnecessaryCast = false
reportImplicitStringConcatenation = false
