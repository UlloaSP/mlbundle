name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlbundle-pypi-publish
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with:
      prepare-publish: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi_env
      url: https://pypi.org/p/mlbundle
    permissions:
      id-token: write
    steps:
      - name: Download CI-validated distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
