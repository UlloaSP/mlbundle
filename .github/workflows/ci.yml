name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install UV CLI
        run: python -m pip install uv==0.12.19
      - name: Install development dependencies from lockfile
        run: uv sync --locked --group dev
      - name: Check lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install UV CLI
        run: python -m pip install uv==0.12.19
      - name: Install development dependencies from lockfile
        run: uv sync --locked --group dev
      - name: Check types
        run: uv run pyright

  tests:
    name: Tests (${{ matrix.os }}, Python 3.14)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install UV CLI
        run: python -m pip install uv==0.12.19
      - name: Install development dependencies from lockfile
        run: uv sync --locked --group dev
      - name: Run tests with coverage
        run: uv run pytest
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: error
