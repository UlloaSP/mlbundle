name: Deploy websites

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ matrix.site }}
    if: github.repository == 'UlloaSP/mlbundle' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: landing
            url: https://mlbundle.eshkra.dev
            title: MLbundle
          - site: docs
            url: https://docs.mlbundle.eshkra.dev
            title: mlbundle documentation
          - site: playground
            url: https://playground.mlbundle.eshkra.dev
            title: MLbundle Playground
    environment:
      name: ${{ matrix.site }}
      url: ${{ matrix.url }}
    concurrency:
      group: mlbundle-${{ matrix.site }}-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24.14.1'
          cache: true

      - name: Install locked deployment tooling
        run: vp install --frozen-lockfile

      - name: Download tested site
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.site }}-build
          path: ${{ matrix.site }}/dist/

      - name: Deploy static assets and custom domain
        run: vp exec wrangler deploy --config "$SITE/wrangler.jsonc"
        env:
          SITE: ${{ matrix.site }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check the deployed homepage
        env:
          SITE_URL: ${{ matrix.url }}
          EXPECTED_TITLE: ${{ matrix.title }}
        run: |
          curl --fail --silent --show-error --location --retry 10 --retry-delay 15 \
            --retry-all-errors --max-time 20 "$SITE_URL/" -o "$RUNNER_TEMP/site.html"
          grep -Fq "<title>$EXPECTED_TITLE" "$RUNNER_TEMP/site.html"
